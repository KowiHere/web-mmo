<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>web-mmo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23181c24%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%278%27 fill=%27%236ea8fe%27/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="join" class="overlay">
    <form id="join-form">
        <h1>web-mmo</h1>
        <p class="lead">
            Wpisz nazwę postaci i wejdź na mapę.
            Otwórz drugą kartę, żeby zobaczyć tryb wieloosobowy.
        </p>

        <input id="name" maxlength="16" placeholder="Nazwa postaci" autocomplete="off" required>
        <button type="submit">Wejdź do gry</button>

        <dl class="controls">
            <dt>WASD / strzałki</dt>
            <dd>chodzenie</dd>
            <dt>kliknięcie</dt>
            <dd>idź na wskazany kafel</dd>
            <dt>Enter</dt>
            <dd>czat; Enter wysyła i wraca do gry</dd>
            <dt>Esc</dt>
            <dd>powrót do sterowania grą</dd>
            <dt>F3</dt>
            <dd>podgląd diagnostyczny</dd>
        </dl>
    </form>
</div>

<div id="game" hidden>
    <canvas id="view"></canvas>

    <div id="hud">
        <span id="map-name"></span>
        <span id="status" class="status"></span>
    </div>

    <pre id="debug" hidden></pre>

    <div id="chat">
        <ul id="chat-log"></ul>
        <input id="chat-input" maxlength="200" placeholder="Enter, żeby pisać" autocomplete="off">
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
