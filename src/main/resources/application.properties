spring.application.name=web-mmo
server.port=8080

# Comma-separated list of origins allowed to open a game socket.
# Keep this tight: a WebSocket handshake is not covered by the browser's
# same-origin policy, so this is the only thing standing in for it.
game.allowed-origins=http://localhost:8080

logging.level.com.kowihere.mmo=DEBUG

# An embedded file database: no server to install and no container to run.
# The schema is owned by Flyway (src/main/resources/db/migration), never by
# Hibernate - a migration should be a file you can read, not a side effect.
spring.datasource.url=jdbc:h2:file:./data/web-mmo
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true

